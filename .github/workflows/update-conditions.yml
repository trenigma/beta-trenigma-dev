name: Update Crag Conditions

on:
  schedule:
    # Run every 6 hours — keeps conditions fresh without hammering the API
    # Cron syntax: minute hour day month weekday
    # 0 */6 * * * = top of every 6th hour (00:00, 06:00, 12:00, 18:00 UTC)
    # In Pacific time: 4pm, 10pm, 4am, 10am — good coverage for morning send checks
    - cron: '0 */6 * * *'

  # Allow manual trigger from GitHub Actions tab
  # Useful for testing and forcing a refresh on demand
  workflow_dispatch:

jobs:
  update-conditions:
    runs-on: ubuntu-latest

    # Required: allows the workflow to commit files back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch crag conditions
        run: |
          python scripts/fetch_conditions.py

      - name: Commit and push updated conditions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/conditions.json
          # Only commit if conditions.json actually changed
          git diff --staged --quiet || git commit -m "Auto: Update crag conditions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push