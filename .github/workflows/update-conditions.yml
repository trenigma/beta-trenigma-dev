name: Update Crag Conditions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-conditions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch crag conditions
        env:
          LOKI_USER:    ${{ secrets.LOKI_USER }}
          LOKI_API_KEY: ${{ secrets.LOKI_API_KEY }}
          LOKI_URL:     ${{ secrets.LOKI_URL }}
        run: |
          python scripts/fetch_conditions.py

      - name: Purge history files older than 30 days
        run: |
          find data/history/ -name "*.json" -mtime +30 -delete 2>/dev/null || true
          echo "Purge step complete"

      - name: Commit and push updated conditions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/conditions.json data/history/
          git diff --staged --quiet || git commit -m "Auto: Update crag conditions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push